<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수능 시험실 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column — title, three large room cards, then a quiet admin link */
:root{
  --bg:#eef2f0;
  --surface:#ffffff;
  --line:rgba(28,52,40,.13);
  --fg:#1c2a23;
  --muted:#5a6a62;
  --accent:#2f6b4f;
  --accent-bg:rgba(47,107,79,.10);
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151a17;--surface:#1e2622;--line:rgba(220,235,226,.13);--fg:#e6eee9;--muted:#9fb0a7;
    --accent:#5fae86;--accent-bg:rgba(95,174,134,.14);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151a17;--surface:#1e2622;--line:rgba(220,235,226,.13);--fg:#e6eee9;--muted:#9fb0a7;
  --accent:#5fae86;--accent-bg:rgba(95,174,134,.14);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(40px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:28px}
header{display:grid;gap:6px}
.eyebrow{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
h1{margin:0;font-size:clamp(26px,5vw,34px);font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:14.5px}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.room{
  display:grid;gap:8px;align-content:start;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 18px 18px;
  transition:border-color .15s, transform .15s, box-shadow .15s;min-width:0
}
.room:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,25,18,.10)}
.room:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.room .icon{width:44px;height:44px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center}
.room b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.room span{font-size:13px;color:var(--muted)}
.room .go{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--accent)}
.admin{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:18px
}
.admin p{margin:0;font-size:13px;color:var(--muted)}
.admin a{
  font-size:14px;font-weight:600;color:var(--fg);text-decoration:none;
  border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px
}
.admin a:hover{border-color:var(--accent)}
.admin a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:640px){ .rooms{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ .room{transition:none} .room:hover{transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">수능 시험실 준비</p>
    <h1>점검할 시험실을 고르세요</h1>
    <p class="lead">들어가면 학년-반과 비밀번호를 입력한 뒤 3D 배치도를 보며 점검표를 체크할 수 있어요.</p>
  </header>

  <nav class="rooms" aria-label="시험실 종류">
    <a class="room" href="exam-room.html">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="5" height="3.5" rx=".8"/><rect x="9.5" y="4" width="5" height="3.5" rx=".8"/><rect x="16" y="4" width="5" height="3.5" rx=".8"/><rect x="3" y="10.5" width="5" height="3.5" rx=".8"/><rect x="9.5" y="10.5" width="5" height="3.5" rx=".8"/><rect x="16" y="10.5" width="5" height="3.5" rx=".8"/><rect x="3" y="17" width="5" height="3.5" rx=".8"/><rect x="9.5" y="17" width="5" height="3.5" rx=".8"/><rect x="16" y="17" width="5" height="3.5" rx=".8"/></g></svg>
      </span>
      <b>일반 시험실</b>
      <span>5열 × 6석 (28석)</span>
      <span class="go">들어가기 →</span>
    </a>
    <a class="room" href="separate-room.html">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><rect x="9" y="10" width="6" height="4" rx=".8"/></g></svg>
      </span>
      <b>별도시험실</b>
      <span>편의제공시험실 포함 · 1석</span>
      <span class="go">들어가기 →</span>
    </a>
    <a class="room" href="hq.html">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5v14M4 19h16M20 19V5"/><path d="M8 5h8"/><rect x="9" y="10" width="6" height="4" rx=".8"/></g></svg>
      </span>
      <b>관리본부</b>
      <span>시험지 배부·답안지 수거 (2-4반)</span>
      <span class="go">들어가기 →</span>
    </a>
  </nav>

  <div class="admin">
    <p>관리 담당 선생님용 · 모든 시험실의 점검 완료 여부와 비고를 한눈에 봐요.</p>
    <a href="status.html">전체 점검 현황 보기</a>
  </div>
</div>
</body>
</html>
