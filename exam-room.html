<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시험실 3D 배치도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; checklist panel docked top-left; zoom stack bottom-right; popover follows the tapped object */
:root{
  --bg:#dfe6e3;
  --panel:rgba(250,252,250,.94);
  --surface:#ffffff;
  --line:rgba(28,52,40,.14);
  --fg:#1c2a23;
  --muted:#5a6a62;
  --accent:#2f6b4f;
  --accent-fg:#ffffff;
  --btn:rgba(28,52,40,.06);
  --warn:#b85a00;
  --warn-bg:rgba(230,120,10,.13);
  --chip-odd:#bdbdbd;
  --chip-even:#ffffff;
  --font:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a201d;--panel:rgba(24,30,27,.93);--surface:#1f2723;--line:rgba(220,235,226,.14);--fg:#e6eee9;--muted:#9fb0a7;
    --accent:#5fae86;--accent-fg:#0f1a14;--btn:rgba(220,235,226,.07);--warn:#f0a24a;--warn-bg:rgba(240,162,74,.14);
    --chip-odd:#9a9a9a;--chip-even:#e8e8e8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a201d;--panel:rgba(24,30,27,.93);--surface:#1f2723;--line:rgba(220,235,226,.14);--fg:#e6eee9;--muted:#9fb0a7;
  --accent:#5fae86;--accent-fg:#0f1a14;--btn:rgba(220,235,226,.07);--warn:#f0a24a;--warn-bg:rgba(240,162,74,.14);
  --chip-odd:#9a9a9a;--chip-even:#e8e8e8;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}

*,*::before,*::after{box-sizing:border-box}
.glass{
  background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 8px 28px rgba(10,25,18,.14);
}
.panel{
  position:fixed;z-index:10;
  top:calc(12px + env(safe-area-inset-top, 0px));
  left:max(16px, env(safe-area-inset-left, 0px));
  width:min(380px, calc(100vw - 32px));
  max-height:calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  border-radius:12px;
  padding:14px 12px 12px 14px;
  display:flex;flex-direction:column;gap:12px;
}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.head h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.meta{margin:3px 0 0;font-size:12px;color:var(--muted)}
.fold{
  flex:none;border:1px solid var(--line);background:var(--btn);color:var(--fg);
  font:500 12px var(--font);border-radius:8px;padding:5px 9px;cursor:pointer
}
.body{display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.panel.collapsed .body{display:none}

.progress{display:grid;gap:8px}
.prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.prog-num{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-num b{font-size:24px;font-weight:700;color:var(--fg);letter-spacing:-.02em}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-variant-numeric:tabular-nums}
.pill.ok{background:var(--btn);color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.prog-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--muted);font:500 12px var(--font);cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
.link.armed{color:var(--warn);font-weight:600}

.list{overflow:auto;min-height:150px;flex:1;margin-right:-6px;padding-right:6px;border-top:1px solid var(--line)}
.cat{border-bottom:1px solid var(--line)}
.cat-h{
  width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg);
  font:600 13px var(--font);padding:10px 2px 8px;cursor:pointer;text-align:left
}
.cat-name{flex:1}
.cat-count{font-size:12px;font-weight:600;color:var(--warn);font-variant-numeric:tabular-nums}
.cat.complete .cat-count{color:var(--accent)}
.chev{transition:transform .2s;color:var(--muted)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat.closed ul{display:none}
.cat ul{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:2px}
.item{display:flex;align-items:flex-start;gap:4px;padding:6px 2px 6px 4px;border-radius:8px}
.item:hover{background:var(--btn)}
.item.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--warn-bg)}100%{background:transparent}}
.chk{display:flex;gap:10px;flex:1;min-width:0;cursor:pointer;align-items:flex-start;position:relative}
.chk input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.bx{flex:none;width:18px;height:18px;border:1.5px solid var(--warn);border-radius:5px;margin-top:1px;display:grid;place-items:center;background:var(--surface);transition:background .15s,border-color .15s}
.chk input:checked + .bx{background:var(--accent);border-color:var(--accent)}
.chk input:checked + .bx::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent-fg);border-bottom:2px solid var(--accent-fg);transform:translateY(-1px) rotate(-45deg)}
.chk input:focus-visible + .bx{outline:2px solid var(--accent);outline-offset:2px}
.txt{font-size:13px;line-height:1.45;min-width:0}
.txt small{display:block;font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.txt small .no{font-weight:600;color:var(--accent)}
.item.done .txt{color:var(--muted)}
.item.done .txt > span{text-decoration:line-through;text-decoration-color:var(--line)}
.loc{
  flex:none;width:30px;height:28px;border:0;border-radius:7px;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center
}
.loc:hover{background:var(--btn);color:var(--accent)}
.loc:focus-visible,.cat-h:focus-visible,.link:focus-visible,.fold:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.noloc{flex:none;width:30px}
.all-done{margin:14px 2px;font-size:13px;color:var(--accent);font-weight:600}

.foot{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{
  border:1px solid var(--line);background:var(--btn);color:var(--fg);
  font:500 13px var(--font);border-radius:8px;padding:7px 2px;cursor:pointer;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s
}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}
.toggle input{width:15px;height:15px;accent-color:var(--accent);margin:0}
.hint{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.hint i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff8a1f;margin:0 3px 0 1px;vertical-align:0}

.zoom{
  position:fixed;z-index:10;
  right:max(16px, env(safe-area-inset-right, 0px));
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
}
.zoom button{
  width:44px;height:44px;border:0;background:transparent;color:var(--fg);
  font:500 24px/1 var(--font);cursor:pointer;display:grid;place-items:center;
}
.zoom button + button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--btn);color:var(--accent)}
.zoom button:active{background:var(--line)}
.zoom button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}

.pop{
  position:fixed;z-index:30;left:0;top:0;
  width:min(330px, calc(100vw - 24px));max-height:min(70vh, 520px);overflow:auto;
  border-radius:12px;padding:12px 10px 10px 12px;
}
.pop-h{display:flex;align-items:center;gap:8px}
.pop-h b{flex:1;font-size:14.5px}
.pop-x{border:0;background:var(--btn);color:var(--fg);width:28px;height:28px;border-radius:8px;font:500 18px/1 var(--font);cursor:pointer}
.pop-x:focus-visible,.pop-all:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pop-sub{margin:2px 0 8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pop ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.pop .tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:5px;vertical-align:1px}
.pop-all{
  margin-top:8px;width:100%;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  font:600 13px var(--font);border-radius:8px;padding:8px;cursor:pointer
}

.toast{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  width:max-content;max-width:min(560px, calc(100vw - 140px));
  display:flex;align-items:center;gap:12px;
  background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px 10px 14px;
  font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)
}
.toast span{min-width:0}
.toast button{flex:none;border:0;background:none;color:var(--bg);font:600 13px var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px}
.tip{
  position:fixed;z-index:20;pointer-events:none;left:0;top:0;
  background:var(--fg);color:var(--bg);font-size:12px;font-weight:500;border-radius:6px;padding:4px 8px;white-space:nowrap
}
/* 첫 화면: 학년·반 + 비밀번호 */
.gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;
  padding-block:calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.gate-card{width:min(380px,100%);border-radius:16px;padding:24px 22px 20px;display:grid;gap:16px}
.gate-card h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.gate-card .sub{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field textarea{
  font:500 18px var(--font);color:var(--fg);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;
  font-variant-numeric:tabular-nums;letter-spacing:.02em
}
.field textarea{font-size:14.5px;line-height:1.5;resize:vertical;min-height:72px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.7}
.field input:focus-visible,.field textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
.field input[aria-invalid="true"]{border-color:var(--warn)}
.gate-err{margin:-4px 0 0;font-size:12.5px;font-weight:600;color:var(--warn);min-height:1.2em}
.gate-go{
  border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);
  font:700 15px var(--font);padding:12px;cursor:pointer
}
.gate-go:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.submit{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
.submit form{display:grid;gap:10px}
.submit-wait{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.submit-title{margin:0;font-size:14px;font-weight:700;color:var(--accent)}
.submit .field input{font-size:16px;padding:9px 11px}
.submit .gate-go{padding:10px}
.submit .gate-go:disabled{opacity:.6;cursor:progress}
.sub-msg{margin:0;font-size:12.5px;font-weight:600;line-height:1.45;min-height:1.2em}
.sub-msg.ok{color:var(--accent)}
.sub-msg.err{color:var(--warn)}
.room-tag{display:inline-block;margin:0 0 4px;font-size:12px;font-weight:700;color:var(--accent-fg);background:var(--accent);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
.head-btns{display:flex;gap:6px;flex:none}

@media (max-width:520px){
  /* 휴대폰: 패널 전체를 한 번에 스크롤, 팝업은 아래쪽 시트, 알림은 확대 버튼과 겹치지 않게 */
  .panel{max-height:calc(100vh - 110px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));padding:12px 10px 10px 12px}
  .body{overflow:auto;margin-right:-6px;padding-right:6px}
  .list{overflow:visible;flex:none;margin-right:0;padding-right:0}
  .txt{font-size:14px}
  .item{padding:8px 2px 8px 4px}
  .bx{width:20px;height:20px}
  .loc{width:36px;height:34px}
  .pop{left:12px !important;right:12px;top:auto !important;width:auto;
       bottom:calc(12px + env(safe-area-inset-bottom, 0px));max-height:62vh}
  .toast{left:16px;transform:none;bottom:calc(16px + env(safe-area-inset-bottom, 0px));max-width:calc(100vw - 32px - 64px)}
}
@media (prefers-reduced-motion: reduce){
  .bar i,.chev,.bx{transition:none}
  .item.flash{animation:none}
}
</style>
</head>
<body>
<div id="stage" aria-label="시험실 3D 장면"></div>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
  <form class="gate-card glass" id="gate-form" autocomplete="off" onsubmit="return false">
    <div>
      <h2 id="gate-title">시험실 3D 배치도</h2>
      <p class="sub">점검할 교실의 학년·반과 비밀번호를 입력하세요.</p>
    </div>
    <div class="field">
      <label for="gate-class">학년-반</label>
      <input id="gate-class" name="gate-class" type="text" inputmode="numeric" placeholder="예: 3-3" maxlength="8" required>
    </div>
    <div class="field">
      <label for="gate-pw">비밀번호</label>
      <input id="gate-pw" name="gate-pw" type="password" inputmode="numeric" placeholder="숫자 4자리" maxlength="8" required>
    </div>
    <p class="gate-err" id="gate-err" role="alert"></p>
    <button type="submit" class="gate-go" id="gate-go">점검 시작</button>
  </form>
</div>

<div class="zoom glass" role="group" aria-label="확대·축소">
  <button type="button" id="zoom-in" aria-label="확대">+</button>
  <button type="button" id="zoom-out" aria-label="축소">−</button>
  <button type="button" id="zoom-reset" aria-label="처음 시점으로">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<section class="panel glass" id="panel" aria-label="시험실 점검표">
  <div class="head">
    <div>
      <p class="room-tag" id="room-tag" hidden></p>
      <h1>시험실 3D 배치도</h1>
      <p class="meta">시험실 준비 점검표 · 3D에서 눌러서 체크</p>
    </div>
    <div class="head-btns">
      <button class="fold" id="lock" type="button" title="다른 사람이 만지지 못하게 잠그기">잠금</button>
      <button class="fold" id="fold" type="button" aria-expanded="true">접기</button>
    </div>
  </div>
  <div class="body">
    <div class="progress">
      <div class="prog-top">
        <span class="prog-num"><b id="p-done">0</b> / <span id="p-total">0</span> 완료</span>
        <span class="pill" id="p-left">남은 0개</span>
      </div>
      <div class="bar" role="progressbar" aria-label="점검 진행률" aria-valuemin="0" aria-valuemax="100" id="p-barwrap"><i id="p-bar"></i></div>
      <div class="prog-actions">
        <label class="toggle"><input type="checkbox" id="only-left"><span>남은 항목만 보기</span></label>
        <button type="button" class="link" id="reset">처음부터 다시</button>
      </div>
    </div>
    <div class="list" id="list"></div>
    <section class="submit" id="submit" aria-label="점검 완료 제출">
      <p class="submit-wait" id="submit-wait">모든 항목을 체크하면 담임교사 성함을 적고 점검 완료를 제출할 수 있어요.</p>
      <form id="submit-form" hidden onsubmit="return false">
        <p class="submit-title">모든 항목 완료 · 점검 완료 제출</p>
        <div class="field">
          <label for="sub-teacher">담임교사 성함</label>
          <input id="sub-teacher" name="sub-teacher" type="text" maxlength="20" placeholder="예: 홍길동" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="sub-note">비고 (이상이 있을 때만 적어 주세요)</label>
          <textarea id="sub-note" name="sub-note" rows="3" maxlength="500" placeholder="예: 14번 책상 다리 흔들림, 교체 요청"></textarea>
        </div>
        <button type="submit" class="gate-go" id="sub-go">점검 완료 제출</button>
        <p class="sub-msg" id="sub-msg" role="status"></p>
      </form>
    </section>
    <div class="foot">
      <div>
        <p class="label">창가 블라인드</p>
        <div class="seg" id="blind">
          <button type="button" id="b-up" data-level="0" aria-pressed="true">올리기</button>
          <button type="button" id="b-half" data-level="0.5" aria-pressed="false">절반</button>
          <button type="button" id="b-down" data-level="1" aria-pressed="false">내리기</button>
        </div>
      </div>
      <div>
        <p class="label">가운데 화이트보드</p>
        <div class="seg" id="slide">
          <button type="button" id="s-left" data-pos="-1" aria-pressed="true">왼쪽으로</button>
          <button type="button" id="s-mid" data-pos="0" aria-pressed="false">가운데</button>
          <button type="button" id="s-right" data-pos="1" aria-pressed="false">오른쪽으로</button>
        </div>
      </div>
      <div>
        <p class="label">전자칠판</p>
        <div class="seg two" id="eboard">
          <button type="button" id="e-on" data-on="1" aria-pressed="true">켜기 (점검표 화면)</button>
          <button type="button" id="e-off" data-on="0" aria-pressed="false">끄기</button>
        </div>
      </div>
      <div class="row">
        <label class="toggle"><input type="checkbox" id="emph" checked><span>남은 항목 숫자 표시</span></label>
        <label class="toggle"><input type="checkbox" id="labels" checked><span>좌석 번호</span></label>
      </div>
      <p class="hint">3D에서 책상·사물함·선풍기 같은 물건이나 <i aria-hidden="true"></i>주황 숫자를 누르면 관련 항목이 체크됩니다. 숫자는 그 자리에 남은 점검 항목 수예요.</p>
    </div>
  </div>
</section>

<div class="pop glass" id="pop" role="dialog" aria-labelledby="pop-title" hidden>
  <div class="pop-h"><b id="pop-title"></b><button type="button" class="pop-x" id="pop-x" aria-label="닫기">×</button></div>
  <p class="pop-sub" id="pop-sub"></p>
  <ul id="pop-list"></ul>
  <button type="button" class="pop-all" id="pop-all">이 물건 항목 모두 완료</button>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" id="toast-undo">되돌리기</button></div>
<div class="tip" id="tip" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async function(){
  // ▼ 구글 앱스크립트 웹앱 주소: 배포 후 '.../exec' 주소를 따옴표 안에 붙여넣기
  const REPORT_URL='https://script.google.com/macros/s/AKfycbxhR51hH5tkUs21N0sZlb2Vc22fyFzz31vKDd3MPzXlR4r7BI6iNViYBz-k_NyQPEzB/exec';
  const FONT = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  try{
    await Promise.race([
      Promise.all([document.fonts.load('600 40px "IBM Plex Sans KR"'), document.fonts.load('700 40px "IBM Plex Sans KR"')]),
      new Promise(r=>setTimeout(r,1500))
    ]);
  }catch(e){}

  /* ---------- 실측 치수 ----------
     교실 9.0 × 9.0 m, 천장 2.8 m
     뒷벽 사물함: 30 × 50 × 40 cm 칸, 15칸 × 2단 (폭 4.5 m, 높이 1.0 m, 깊이 0.4 m)
     평면도 픽셀: 좌우 17~1270 → 9 m,  앞벽(칠판 줄 아래) 192 ~ 뒤 1037 → 사물함 앞면까지 8.6 m */
  const W=9.0, D=9.0, H=2.8;
  const LX=-W/2, RX=W/2, FZ=-D/2, BZ=D/2, T=0.2;

  /* 좌석 격자: 열 간격 1.8 m, 줄 간격 1.19 m (책상 간격을 넓힘)
     교탁 앞면이 칠판에서 0.9 m 떨어져 감독 통로 확보, 교탁 뒷면과 짝수18 책상은 약 5 cm 간격 */
  const COLS={A:-3.6,B:-1.8,C:0,D:1.8,E:3.6};
  const ROW0=-2.68, ROW_P=1.19;
  const rowZ=r=>ROW0+r*ROW_P;

  /* 사물함: 짝수28 뒤(왼쪽 벽 모서리)부터 홀수11과 홀수5 사이까지, 15칸 × 2단 */
  const LOCK_H=0.5, LOCK_D=0.4, LOCK_N=15, LOCK_ROWS=2;
  const LK_X0=LX, LK_X1=(COLS.D+COLS.E)/2;
  const LOCK_W=(LK_X1-LK_X0)/LOCK_N;

  const stage=document.getElementById('stage');
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xdde6ea);

  const camera=new THREE.PerspectiveCamera(50, stage.clientWidth/stage.clientHeight, 0.05, 120);
  const controls=new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.maxDistance=42; controls.minDistance=0.3;
  controls.maxPolarAngle=Math.PI/2-0.01;

  const ANISO=renderer.capabilities.getMaxAnisotropy();
  function canvasTex(w,h,draw,opt={}){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); draw(g,w,h);
    const t=new THREE.CanvasTexture(c);
    t.encoding=THREE.sRGBEncoding; t.anisotropy=ANISO;
    if(opt.wrap){ t.wrapS=t.wrapT=THREE.RepeatWrapping; }
    return t;
  }
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const srgb=hex=>new THREE.Color(hex).convertSRGBToLinear();
  function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

  /* ---------- 재질 ---------- */
  const M={
    deskTop:new THREE.MeshStandardMaterial({color:0xdcc6a1,roughness:.55}),
    deskEdge:new THREE.MeshStandardMaterial({color:0x8e8a82,roughness:.5}),
    metal:new THREE.MeshStandardMaterial({color:0x8b9095,metalness:.55,roughness:.42}),
    chair:new THREE.MeshStandardMaterial({color:0x5b7d96,roughness:.5}),
    wood:new THREE.MeshStandardMaterial({color:0x8a6948,roughness:.68}),
    woodLight:new THREE.MeshStandardMaterial({color:0xb08c66,roughness:.6}),
    alu:new THREE.MeshStandardMaterial({color:0xbfc3c6,metalness:.6,roughness:.35}),
    jamb:new THREE.MeshStandardMaterial({color:srgb(0xe9e6df),roughness:.9}),
    dark:new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:.4,metalness:.3}),
    glass:new THREE.MeshPhysicalMaterial({color:0xcfe3ea,roughness:.05,metalness:0,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}),
    curtain:new THREE.MeshStandardMaterial({color:0xe9e2cf,roughness:.95}),
    corridorWall:new THREE.MeshStandardMaterial({color:0xe8e5dd,roughness:.9}),
    corridorFloor:new THREE.MeshStandardMaterial({color:0x9c9d97,roughness:.7}),
    lamp:new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfffaf0,emissiveIntensity:1.1}),
    lampFrame:new THREE.MeshStandardMaterial({color:0xdedede,roughness:.5}),
    locker:new THREE.MeshStandardMaterial({color:srgb(0xc9ccc8),roughness:.55,metalness:.15}),
    wbFrame:new THREE.MeshStandardMaterial({color:0xc9cdd0,metalness:.65,roughness:.3}),
  };

  function box(w,h,d,mat,x,y,z,parent,cast=true){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true;
    (parent||scene).add(m); return m;
  }

  /* ---------- 점검 대상 등록: 3D 물건 ↔ 점검 항목 연결 ---------- */
  const REG={}, KEYMATS={}, matCache=new Map();
  const mark=()=>scene.children.length;
  function keyMat(key,mat){
    const id=key+'|'+mat.uuid;
    if(matCache.has(id)) return matCache.get(id);
    const c=mat.clone();
    c.userData.baseE=mat.emissive.clone(); c.userData.baseI=mat.emissiveIntensity;
    matCache.set(id,c); (KEYMATS[key]=KEYMATS[key]||[]).push(c);
    return c;
  }
  function reg(key,obj){
    obj.traverse(m=>{
      if(!m.isMesh || m.userData.key) return;
      m.userData.key=key;
      (REG[key]=REG[key]||[]).push(m);
      const mat=m.material;
      if(mat && mat.isMeshStandardMaterial && !mat.transparent) m.material=keyMat(key,mat);
    });
  }
  function claim(key,from){ scene.children.slice(from).forEach(o=>reg(key,o)); }

  /* ---------- 조명 ---------- */
  scene.add(new THREE.HemisphereLight(0xffffff,0xb39a7c,.55));
  scene.add(new THREE.AmbientLight(0xffffff,.22));
  const sun=new THREE.DirectionalLight(0xfff1dc,1.0);
  sun.position.set(-9,6.5,2.5); sun.target.position.set(0,0,0);
  sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:30});
  sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
  scene.add(sun, sun.target);
  const topLight=new THREE.DirectionalLight(0xffffff,.35); topLight.position.set(1,10,-1); scene.add(topLight);

  /* ---------- 바닥 ---------- */
  const floorTex=canvasTex(1024,1024,(g,w,h)=>{
    g.fillStyle='#b88d5e'; g.fillRect(0,0,w,h);
    const rows=14, ph=h/rows;
    for(let r=0;r<rows;r++){
      let x=-rnd(0,260);
      while(x<w){
        const len=rnd(180,420);
        g.fillStyle=`hsl(${rnd(27,33)}, ${rnd(34,44)}%, ${rnd(50,60)}%)`;
        g.fillRect(x,r*ph,len,ph);
        g.globalAlpha=.07; g.fillStyle='#4a2c12';
        for(let k=0;k<6;k++) g.fillRect(x, r*ph+rnd(4,ph-4), len, 1.4);
        g.globalAlpha=1;
        g.fillStyle='rgba(60,34,14,.38)'; g.fillRect(x,r*ph,2,ph);
        x+=len;
      }
      g.fillStyle='rgba(60,34,14,.32)'; g.fillRect(0,r*ph,w,2);
    }
  },{wrap:true});
  floorTex.repeat.set(W/1.4, D/1.4);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({map:floorTex,roughness:.55}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor); reg('floor',floor);

  /* ---------- 벽 (안쪽 면만 렌더 → 밖에서 보면 투시) ---------- */
  const WAIN=1.0;
  const drawWall=(g,w,h)=>{
    const split=h*(1-WAIN/H);
    g.fillStyle='#f2efe8'; g.fillRect(0,0,w,split);
    g.fillStyle='#d6c7ad'; g.fillRect(0,split,w,h-split);
    g.fillStyle='#a88c66'; g.fillRect(0,split-6,w,8);
    g.fillStyle='#9a8262'; g.fillRect(0,h-10,w,10);
  };
  const wallTex=canvasTex(16,512,drawWall);
  wallTex.wrapS=THREE.RepeatWrapping; wallTex.repeat.set(1,1/H);
  const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.92});
  const pillarMat=new THREE.MeshStandardMaterial({map:canvasTex(16,512,drawWall),roughness:.92});

  function wallGeo(len,h,holes){
    const s=new THREE.Shape();
    s.moveTo(-len/2,0); s.lineTo(len/2,0); s.lineTo(len/2,h); s.lineTo(-len/2,h); s.lineTo(-len/2,0);
    holes.forEach(([a,b,y0,y1])=>{
      const p=new THREE.Path(); p.moveTo(a,y0); p.lineTo(a,y1); p.lineTo(b,y1); p.lineTo(b,y0); p.lineTo(a,y0);
      s.holes.push(p);
    });
    return new THREE.ShapeGeometry(s);
  }
  function addWall(geo,pos,rotY){
    const m=new THREE.Mesh(geo,wallMat); m.position.copy(pos); m.rotation.y=rotY;
    m.receiveShadow=true; scene.add(m); return m;
  }

  /* --- 기둥: 짝수2와 홀수3 사이, 양쪽 벽 (폭 60 cm, 20 cm 돌출) --- */
  const PIL_Z=(rowZ(2)+rowZ(3))/2, PIL_W=0.6, PIL_P=0.2;

  /* --- 출입문 (복도쪽 = 오른쪽 벽): 앞문은 교탁 옆, 뒷문은 홀수5 옆
     각 출입문은 미닫이 문짝 2장 (앞·뒤 레일), 개구부 폭 1.8 m --- */
  const DOOR_W=1.8, DOOR_H=2.1;
  const doorZ=[FZ+0.1+DOOR_W/2, rowZ(5)];

  /* --- 복도쪽 쪽창: 창과 출입문 위에 한 줄로 --- */
  const RT_Y0=2.35, RT_Y1=2.7;

  /* --- 복도쪽 창: 앞문~기둥, 기둥~뒷문 구간을 창 2개씩 빈틈없이 채움 --- */
  const HW_Y0=0.95, HW_Y1=2.25;
  const hallSpans=[
    [doorZ[0]+DOOR_W/2+0.1, PIL_Z-PIL_W/2],
    [PIL_Z+PIL_W/2, doorZ[1]-DOOR_W/2-0.1],
  ];

  /* --- 창가쪽(왼쪽 벽) 창 8개: 앞벽~기둥 4개, 기둥~뒷벽 4개
     창 폭은 이전보다 25% 줄여 구간 가운데 정렬, 창 윗선 = 화이트보드 윗선(2.08 m)
     그 위로 환기용 쪽창 --- */
  const R_Y0=1.0, R_Y1=0.88+1.2, R_N=4;
  const TR_Y0=R_Y1+0.1, TR_Y1=TR_Y0+0.4;
  const winGroups=[[FZ+0.08, PIL_Z-PIL_W/2],[PIL_Z+PIL_W/2, BZ-0.08]].map(([a,b])=>{
    const c=(a+b)/2, w=(b-a)*0.75; return [c-w/2, c+w/2];
  });

  reg('frontWall', addWall(wallGeo(W,H,[]), new THREE.Vector3(0,0,FZ), 0));
  let m0=mark();
  addWall(wallGeo(W,H,[]), new THREE.Vector3(0,0,BZ), Math.PI);
  // 왼쪽 벽: 로컬 x = -z
  addWall(wallGeo(D,H,winGroups.flatMap(([z0,z1])=>[[-z1,-z0,R_Y0,R_Y1],[-z1,-z0,TR_Y0,TR_Y1]])), new THREE.Vector3(LX,0,0), Math.PI/2);
  // 오른쪽 벽: 로컬 x = +z
  addWall(wallGeo(D,H,[
    ...doorZ.map(z=>[z-DOOR_W/2,z+DOOR_W/2,0,DOOR_H]),
    ...hallSpans.map(([a,b])=>[a,b,HW_Y0,HW_Y1]),
    ...hallSpans.map(([a,b])=>[a,b,RT_Y0,RT_Y1]),
    ...doorZ.map(z=>[z-DOOR_W/2,z+DOOR_W/2,RT_Y0,RT_Y1]),
  ]), new THREE.Vector3(RX,0,0), -Math.PI/2);

  // 기둥
  [[LX,1],[RX,-1]].forEach(([wx,s])=>{
    const p=box(PIL_P,H,PIL_W,pillarMat,wx+s*PIL_P/2,H/2,PIL_Z);
    p.castShadow=false;
  });
  claim('walls',m0);

  /* ---------- 창 만들기 ---------- */
  // side: 'L' 또는 'R'.  out = 바깥쪽 방향(+1/-1)
  function windowOpening(side,z0,z1,y0,y1,panes,sill){
    const out= side==='L'?-1:1, WX= side==='L'?LX:RX, cz=(z0+z1)/2, wz=z1-z0, hh=y1-y0, cy=(y0+y1)/2;
    box(T,0.02,wz,M.jamb,WX+out*T/2,y1,cz,null,false);
    box(T,0.02,wz,M.jamb,WX+out*T/2,y0,cz,null,false);
    box(T,hh,0.02,M.jamb,WX+out*T/2,cy,z0,null,false);
    box(T,hh,0.02,M.jamb,WX+out*T/2,cy,z1,null,false);
    if(sill) box(0.2,0.03,wz+0.08,M.jamb,WX-out*0.07,y0-0.012,cz);
    const pw=wz/panes;
    for(let i=0;i<panes;i++){
      const a=z0+i*pw-(i?0.02:0), b=z0+(i+1)*pw+(i<panes-1?0.02:0), pc=(a+b)/2, w=b-a;
      const xx=WX+out*(i%2?0.05:0.1);
      box(0.035,0.045,w,M.alu,xx,y0+0.022,pc,null,false);
      box(0.035,0.045,w,M.alu,xx,y1-0.022,pc,null,false);
      box(0.035,hh,0.045,M.alu,xx,cy,a+0.022,null,false);
      box(0.035,hh,0.045,M.alu,xx,cy,b-0.022,null,false);
      const gl=new THREE.Mesh(new THREE.PlaneGeometry(w-0.07,hh-0.07),M.glass);
      gl.rotation.y=Math.PI/2; gl.position.set(xx,cy,pc); scene.add(gl);
    }
  }
  // 창가쪽: 4개씩 두 묶음 (미서기 창) + 위쪽 환기용 쪽창 4개씩
  m0=mark();
  winGroups.forEach(([z0,z1])=>{
    windowOpening('L',z0,z1,R_Y0,R_Y1,R_N,true);
    windowOpening('L',z0,z1,TR_Y0,TR_Y1,R_N,false);
    const pw=(z1-z0)/R_N;
    for(let i=0;i<R_N;i++){                                    // 쪽창 손잡이
      box(0.03,0.025,0.1,M.dark,LX-0.03-(i%2?0.05:0.1)+0.06,TR_Y0+0.06,z0+pw*(i+0.5),null,false);
    }
  });
  // 복도쪽: 구간마다 창 2개 (총 4개)
  hallSpans.forEach(([a,b])=>{
    windowOpening('R',a,b,HW_Y0,HW_Y1,2,true);
    windowOpening('R',a,b,RT_Y0,RT_Y1,2,false);                 // 창 위 쪽창
  });
  doorZ.forEach(z=>windowOpening('R',z-DOOR_W/2,z+DOOR_W/2,RT_Y0,RT_Y1,2,false)); // 출입문 위 쪽창
  claim('windows',m0);

  /* --- 커튼형 블라인드: 창 2개마다 1개 (묶음당 2개, 총 4개) ---
     헤드레일은 창 윗선과 쪽창 사이 벽에 부착 → 내려도 쪽창은 열려 있음 */
  const BL_X=LX+0.2, BL_TOP=TR_Y1+0.08, BL_MIN=0.06, BL_MAX=BL_TOP-(R_Y0+0.03);
  const fabricTex=canvasTex(512,256,(g,w,h)=>{
    g.fillStyle='#ece5d6'; g.fillRect(0,0,w,h);
    const folds=8;
    for(let i=0;i<folds;i++){                                  // 커튼처럼 부드러운 주름
      const x=i*w/folds, gr=g.createLinearGradient(x,0,x+w/folds,0);
      gr.addColorStop(0,'rgba(120,100,70,.16)'); gr.addColorStop(.35,'rgba(255,255,255,.12)');
      gr.addColorStop(.7,'rgba(120,100,70,.04)'); gr.addColorStop(1,'rgba(120,100,70,.16)');
      g.fillStyle=gr; g.fillRect(x,0,w/folds,h);
    }
    g.globalAlpha=.06; g.fillStyle='#5a4a30';
    for(let y=0;y<h;y+=3) g.fillRect(0,y,w,1);
    for(let x=0;x<w;x+=3) g.fillRect(x,0,1,h);
    g.globalAlpha=1;
  },{wrap:true});
  const fabricMat=new THREE.MeshStandardMaterial({map:fabricTex,roughness:.95,side:THREE.DoubleSide});
  const blinds=[];
  m0=mark();
  winGroups.forEach(([z0,z1])=>{
    const half=(z1-z0)/2;
    [z0+half/2, z1-half/2].forEach(zc=>{
      const w=half+0.04, g=new THREE.Group();
      g.position.set(BL_X,BL_TOP,zc); g.rotation.y=Math.PI/2; scene.add(g);
      box(w+0.02,0.07,0.07,M.lampFrame,0,0.035,0,g);                       // 헤드레일
      for(const s of [-1,1]) box(0.03,0.05,0.2,M.lampFrame,s*(w/2-0.06),0.035,-0.1,g,false); // 벽 브래킷
      const geo=new THREE.PlaneGeometry(w,1); geo.translate(0,-0.5,0);
      const fab=new THREE.Mesh(geo,fabricMat); fab.castShadow=true; fab.receiveShadow=true; g.add(fab);
      const bar=box(w,0.025,0.025,M.lampFrame,0,0,0,g);                    // 하단 웨이트바
      const cord=box(0.006,1,0.006,M.lampFrame,w/2-0.05,0,0.02,g,false);   // 조절 줄
      cord.geometry.translate(0,-0.5,0);
      blinds.push({fab,bar});
    });
  });
  claim('blinds',m0);
  let blindLevel=0, blindTarget=0;
  function setBlinds(level){
    const drop=BL_MIN+(BL_MAX-BL_MIN)*level;
    blinds.forEach(b=>{ b.fab.scale.y=drop; b.bar.position.y=-drop; });
    fabricTex.repeat.set(1,drop/0.5);
    sun.intensity=1.0-0.45*level;
  }
  setBlinds(0);

  /* ---------- 천장 + 형광등 ---------- */
  const ceilingGroup=new THREE.Group(); scene.add(ceilingGroup);
  const ceilTex=canvasTex(256,256,(g,w,h)=>{
    g.fillStyle='#f4f4f1'; g.fillRect(0,0,w,h);
    g.fillStyle='rgba(120,120,110,.18)';
    for(let i=0;i<700;i++) g.fillRect(rnd(0,w),rnd(0,h),1.6,1.6);
    g.strokeStyle='#cfcfc8'; g.lineWidth=4; g.strokeRect(0,0,w,h);
  },{wrap:true});
  ceilTex.repeat.set(W/0.6,D/0.6);
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D), new THREE.MeshStandardMaterial({map:ceilTex,roughness:.95}));

  const ray=new THREE.Raycaster(); ray.camera=camera; const ndc=new THREE.Vector2();
  const PIN_HIT=matchMedia('(pointer: coarse)').matches?26:16;
  function visibleChain(o){ while(o){ if(!o.visible) return false; o=o.parent; } return true; }
  function pickAt(cx,cy){
    const r=renderer.domElement.getBoundingClientRect();
    ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    // 핀은 화면상 거리로 판정 (손가락 터치도 잘 잡히도록 반경 넉넉하게)
    let best=null, bd=PIN_HIT*PIN_HIT;
    const v=new THREE.Vector3();
    pinGroup.children.forEach(sp=>{
      if(!sp.visible) return;
      v.copy(sp.position).project(camera);
      if(v.z>1) return;
      const sx=(v.x+1)/2*r.width+r.left, sy=(1-v.y)/2*r.height+r.top;
      const d2=(sx-cx)**2+(sy-cy)**2;
      if(d2<bd){ bd=d2; best=sp.userData.pinKey; }
    });
    if(best) return best;
    const hits=ray.intersectObjects(scene.children,true);
    for(const h of hits){
      const o=h.object;
      if(o.isSprite || !o.isMesh || !visibleChain(o)) continue;
      return o.userData.key||null;
    }
    return null;

    blinds:[1,0.45,0.15]
  };
  // 목록의 위치 버튼 → 카메라가 해당 물건으로 이동하고 깜빡임
  function focusKeys(keys){
    const box3=new THREE.Box3(); let any=false;
    keys.forEach(k=>(REG[k]||[]).forEach(m=>{ box3.expandByObject(m); any=true; }));
    if(!any) return;
    const c=box3.getCenter(new THREE.Vector3()), size=box3.getSize(new THREE.Vector3()).length();
    const F=keys.length===1?FACE[keys[0]]:null;
    const dir=F?new THREE.Vector3(...F).normalize():camera.position.clone().sub(controls.target).normalize();
    if(dir.y<0.35){ dir.y=0.35; dir.normalize(); }
    let dist=THREE.MathUtils.clamp(size*0.85+1.4,2.4,15);
    if(viewAspect()<1) dist*=1.45;
    flyTo(c.clone().add(dir.multiplyScalar(dist)),c,0.9);
    flashKeys(keys,FOCUS,1.6);
    if(window.innerWidth<=520) setCollapsed(true);
  }

  // 남은 항목만 / 초기화
  onlyLeft.addEventListener('change',render);
  const resetBtn=$('reset'); let armTimer=null;
  resetBtn.addEventListener('click',()=>{
    if(!resetBtn.classList.contains('armed')){
      resetBtn.classList.add('armed'); resetBtn.textContent='한 번 더 누르면 모두 해제';
      clearTimeout(armTimer); armTimer=setTimeout(()=>{ resetBtn.classList.remove('armed'); resetBtn.textContent='처음부터 다시'; },3500);
      return;
    }
    clearTimeout(armTimer); resetBtn.classList.remove('armed'); resetBtn.textContent='처음부터 다시';
    const prev=[...done]; done.clear(); save(); render();
    showToast('점검표를 처음 상태로 되돌렸습니다',()=>{ done=new Set(prev); save(); render(); });
  });

  $('emph').addEventListener('change',e=>{ emph=e.target.checked; updatePins(); });
  $('labels').addEventListener('change',e=>{ labels.visible=e.target.checked; });
  const blindCtl=$('blind');
  blindCtl.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    blindTarget=Number(b.dataset.level);
    blindCtl.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
  });
  const panel=$('panel'), fold=$('fold');
  function setCollapsed(c){ panel.classList.toggle('collapsed',c); fold.textContent=c?'펼치기':'접기'; fold.setAttribute('aria-expanded',String(!c)); if(typeof resize==='function') resize(); }
  fold.addEventListener('click',()=>setCollapsed(!panel.classList.contains('collapsed')));
  if(window.innerWidth<520) setCollapsed(true);

  /* ================= 전자칠판 + 가운데 화이트보드 =================
     정비하는 동안: 가운데 화이트보드를 옆으로 밀고 전자칠판에 이 점검표(3D 교실 + 남은 항목)를 띄움
     마지막 단계: 전자칠판을 끄고 화이트보드를 가운데로 → 안내문이 가운데에 오면 완료 */
  const FINAL_ID='zz';
  let ebOn=true, wbTarget=-WB_P, syncing=false;
  const SW=EB_W-0.06, SH=EB_H-0.06, VIEW_W=SW*0.6, LIST_W=SW-VIEW_W;
  const EB_RT=new THREE.WebGLRenderTarget(960,860);
  EB_RT.texture.encoding=THREE.sRGBEncoding;
  const ebCam=new THREE.PerspectiveCamera(40, VIEW_W/SH, 0.1, 100);
  ebCam.position.set(8.2,9.4,9.0); ebCam.lookAt(0,0,0.2);
  const ebView=new THREE.Mesh(new THREE.PlaneGeometry(VIEW_W,SH), new THREE.MeshBasicMaterial({map:EB_RT.texture,toneMapped:false}));
  ebView.position.set(-SW/2+VIEW_W/2,WB_CY,FZ+0.057); scene.add(ebView);
  const ebPanelCanvas=document.createElement('canvas'); ebPanelCanvas.width=640; ebPanelCanvas.height=Math.round(640*SH/LIST_W);
  const ebPanelTex=new THREE.CanvasTexture(ebPanelCanvas); ebPanelTex.encoding=THREE.sRGBEncoding; ebPanelTex.anisotropy=ANISO;
  const ebPanel=new THREE.Mesh(new THREE.PlaneGeometry(LIST_W,SH), new THREE.MeshBasicMaterial({map:ebPanelTex,toneMapped:false}));
  ebPanel.position.set(SW/2-LIST_W/2,WB_CY,FZ+0.057); scene.add(ebPanel);
  reg('eboard',ebView); reg('eboard',ebPanel);
  const pageTitle=document.querySelector('#panel h1').textContent;
  function drawEbPanel(){
    const g=ebPanelCanvas.getContext('2d'), w=ebPanelCanvas.width, h=ebPanelCanvas.height;
    g.fillStyle='#0f1a14'; g.fillRect(0,0,w,h);
    g.fillStyle='#e6eee9'; g.font=`700 38px ${FONT}`; g.textBaseline='top'; g.textAlign='left';
    const ttl=(roomId?roomId+' · ':'')+pageTitle;
    let fs=38; do{ g.font=`700 ${fs}px ${FONT}`; fs-=2; }while(g.measureText(ttl).width>w-68 && fs>24);
    g.fillText(ttl,34,34);
    const n=done.size, total=ITEMS.length;
    g.fillStyle='#9fb0a7'; g.font=`500 26px ${FONT}`; g.fillText('준비 점검표 · 남은 항목',34,84);
    g.fillStyle='#e6eee9'; g.font=`700 64px ${FONT}`; g.fillText(String(n),34,130);
    const nw=g.measureText(String(n)).width;
    g.fillStyle='#9fb0a7'; g.font=`500 30px ${FONT}`; g.fillText(` / ${total} 완료`,34+nw,160);
    g.fillStyle='rgba(220,235,226,.18)'; g.fillRect(34,214,w-68,14);
    g.fillStyle='#5fae86'; g.fillRect(34,214,(w-68)*n/total,14);
    const left=ITEMS.filter(i=>!done.has(i.id));
    g.fillStyle='#f0a24a'; g.font=`700 28px ${FONT}`; g.fillText(left.length?`남은 항목 ${left.length}개`:'모든 항목 완료',34,256);
    g.font=`500 25px ${FONT}`;
    let y=304;
    const wrap=(t,maxW)=>{ const out=[]; let line=''; for(const ch of t){ if(g.measureText(line+ch).width>maxW){ out.push(line); line=ch; } else line+=ch; } if(line) out.push(line); return out; };
    for(const it of left){
      const lines=wrap(it.t,w-110).slice(0,2);
      if(y+lines.length*34>h-40){ g.fillStyle='#9fb0a7'; g.fillText(`… 외 ${left.length-left.indexOf(it)}개`,70,y); break; }
      g.strokeStyle='#f0a24a'; g.lineWidth=3; g.strokeRect(36,y+3,22,22);
      g.fillStyle='#e6eee9'; lines.forEach((l,k)=>g.fillText(l,74,y+k*34));
      y+=lines.length*34+14;
    }
    ebPanelTex.needsUpdate=true;
  }
  function renderEb(){
    if(!ebOn) return;
    const vis=[ebView.visible,ebPanel.visible,ceilingGroup.visible];
    ebView.visible=false; ceilingGroup.visible=false;
    renderer.setRenderTarget(EB_RT); renderer.render(scene,ebCam); renderer.setRenderTarget(null);
    ebView.visible=vis[0]; ceilingGroup.visible=vis[2];
  }
  function pressSeg(id,attr,val){ $(id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val?'true':'false')); }
  function setEb(on){ ebOn=on; ebView.visible=on; ebPanel.visible=on; pressSeg('eboard','on',on?'1':'0'); if(on){ drawEbPanel(); renderEb(); } }
  function setSlide(pos){ wbTarget=pos*WB_P; pressSeg('slide','pos',String(pos)); }
  function syncFromFinal(){            // 마지막 단계 항목을 체크하면 실제 상태도 맞춰 줌
    if(syncing) return;
    if(done.has(FINAL_ID)){ setSlide(0); setEb(false); }
    else if(!ebOn && wbTarget===0){ setSlide(-1); setEb(true); }
  }
  function checkFinal(){               // 버튼으로 마지막 상태를 만들면 항목도 자동 체크
    const fin=!ebOn && Math.abs(wbTarget)<1e-6;
    if(fin && !done.has(FINAL_ID)){
      syncing=true; setDone(FINAL_ID,true); syncing=false;
      showToast('마지막 단계 완료: 전자칠판 끄기 · 화이트보드 가운데',()=>{ setDone(FINAL_ID,false); });
    }else if(!fin && done.has(FINAL_ID)){
      done.delete(FINAL_ID); save(); render();
    }
  }
  $('slide').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; setSlide(Number(b.dataset.pos)); checkFinal(); });
  $('eboard').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; setEb(b.dataset.on==='1'); checkFinal(); });

  /* ---------- 점검 완료 제출 → 구글 시트 ---------- */
  const ROOM_TYPE=(t=>t==='시험실'?'일반시험실':t)(pageTitle.replace(/\s*3D 배치도$/,''));
  const subKey=()=>'exam-submit:'+STORE+':'+roomId;
  let subRoom=null, sending=false;
  const subGet=()=>{ try{ return JSON.parse(localStorage.getItem(subKey())||'{}'); }catch(e){ return {}; } };
  const subSet=o=>{ try{ localStorage.setItem(subKey(),JSON.stringify(Object.assign(subGet(),o))); }catch(e){} };
  const hhmm=iso=>{ const d=new Date(iso); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  function subMsg(t,kind){ const m=$('sub-msg'); m.textContent=t; m.className='sub-msg'+(kind?' '+kind:''); }
  function updateSubmit(){
    const all=done.size===ITEMS.length;
    $('submit-wait').hidden=all; $('submit-form').hidden=!all;
    if(subRoom!==roomId){                 // 반이 바뀌면 그 반의 입력값을 불러옴
      subRoom=roomId; const v=subGet();
      $('sub-teacher').value=v.teacher||''; $('sub-note').value=v.note||''; subMsg('');
    }
    if(!sending){
      const v=subGet();
      if(v.at) subMsg(`제출 완료 · ${hhmm(v.at)}  (고칠 내용이 있으면 다시 제출하면 덮어써요)`,'ok');
      else if(all) subMsg('');
    }
  }
  ['sub-teacher','sub-note'].forEach(id=>$(id).addEventListener('input',()=>subSet({teacher:$('sub-teacher').value,note:$('sub-note').value})));
  $('submit-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const teacher=$('sub-teacher').value.trim(), note=$('sub-note').value.trim();
    if(!teacher){ subMsg('담임교사 성함을 입력해 주세요.','err'); $('sub-teacher').focus(); return; }
    if(done.size!==ITEMS.length){ subMsg('아직 체크하지 않은 항목이 있어요.','err'); return; }
    if(!REPORT_URL){ subMsg('아직 제출 주소가 연결되지 않았어요. 관리 담당 선생님께 알려 주세요.','err'); return; }
    if(!gatePw){ subMsg('보안을 위해 잠금 후 다시 입장한 뒤 제출해 주세요.','err'); return; }
    const btn=$('sub-go'); sending=true; btn.disabled=true; btn.textContent='제출 중…'; subMsg('');
    try{
      const res=await fetch(REPORT_URL,{method:'POST',body:JSON.stringify({
        pw:gatePw, type:ROOM_TYPE, room:roomId, teacher, note, done:done.size, total:ITEMS.length
      })});
      const j=await res.json();
      if(!j.ok) throw new Error(j.error||'제출하지 못했어요.');
      const at=j.at||new Date().toISOString();
      subSet({teacher,note,at});
      subMsg(`제출 완료 · ${hhmm(at)}  (고칠 내용이 있으면 다시 제출하면 덮어써요)`,'ok');
      showToast(`${roomId}반 점검 완료를 제출했습니다`);
    }catch(err){
      const m=err&&err.message;
      subMsg(m&&!/fetch|network|JSON|Unexpected/i.test(m)?`${m} 다시 눌러 주세요.`:'제출하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.','err');
    }finally{ sending=false; btn.disabled=false; btn.textContent='점검 완료 제출'; }
  });

  buildList();
  function applyBoardState(){
    if(done.has(FINAL_ID)){ setSlide(0); wbCenter.position.x=0; setEb(false); }
    else { setSlide(-1); wbCenter.position.x=-WB_P; setEb(true); }
  }
  render(); applyBoardState();

  /* ---------- 첫 화면: 학년-반 + 비밀번호 (전자칠판에서 학생 장난 방지) ---------- */
  const GATE_HASH='5lib8';
  const gateHash=s=>{ let x=2166136261; for(const c of 'exam-gate:'+s){ x^=c.codePointAt(0); x=Math.imul(x,16777619)>>>0; } return x.toString(36); };
  const gate=$('gate'), gClass=$('gate-class'), gPw=$('gate-pw'), gErr=$('gate-err');
  let gatePw=''; try{ gatePw=sessionStorage.getItem('exam-gate-pw')||''; }catch(e){}
  $('gate-title').textContent=pageTitle;
  const normClass=v=>{ const m=String(v).replace(/[\s]/g,'').replace(/[–—_.·]/g,'-').match(/^([1-3])-?(\d{1,2})$/); return m?`${m[1]}-${Number(m[2])}`:null; };
  function openRoom(id){
    roomId=id; loadDone(); render(); applyBoardState();
    const tag=$('room-tag'); tag.textContent=`${id}반`; tag.hidden=false;
    gate.hidden=true;
    try{ sessionStorage.setItem('exam-gate-room',id); localStorage.setItem('exam-last-room',id); }catch(e){}
  }
  function lock(){
    closePop(); gPw.value=''; gErr.textContent=''; gClass.removeAttribute('aria-invalid'); gPw.removeAttribute('aria-invalid');
    gatePw=''; try{ sessionStorage.removeItem('exam-gate-room'); sessionStorage.removeItem('exam-gate-pw'); }catch(e){}
    gate.hidden=false; (gClass.value?gPw:gClass).focus();
  }
  $('gate-form').addEventListener('submit',e=>{
    e.preventDefault();
    const id=normClass(gClass.value);
    gClass.setAttribute('aria-invalid',String(!id)); gPw.setAttribute('aria-invalid','false');
    if(!id){ gErr.textContent='학년-반을 3-3처럼 입력해 주세요.'; gClass.focus(); return; }
    if(gateHash(gPw.value.trim())!==GATE_HASH){
      gPw.setAttribute('aria-invalid','true'); gErr.textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.';
      gPw.value=''; gPw.focus(); return;
    }
    gatePw=gPw.value.trim(); try{ sessionStorage.setItem('exam-gate-pw',gatePw); }catch(e){}
    gClass.value=id; openRoom(id);
  });
  $('lock').addEventListener('click',lock);
  try{ gClass.value=localStorage.getItem('exam-last-room')||''; }catch(e){}
  let resumed=null; try{ resumed=sessionStorage.getItem('exam-gate-room'); }catch(e){}
  if(resumed && normClass(resumed)) openRoom(normClass(resumed)); else lock();

  // 미완료 물건 주황 깜빡임, 체크 직후 초록 반짝임
  const tmpC=new THREE.Color(), addC=new THREE.Color();
  function updateHighlights(t,dt){
    const ps=0.042*Math.min(1,Math.max(0.62,viewAspect()))*(1+0.12*Math.sin(t*4));
    pinGroup.children.forEach(s=>s.scale.set(ps,ps,1));
    for(const key in KEYMATS){
      tmpC.setRGB(0,0,0);
      const f=flashes[key];
      if(!f && !KEYMATS[key].dirty) continue;
      KEYMATS[key].dirty=!!f;
      if(f){
        tmpC.add(addC.copy(f.c).multiplyScalar(0.45*Math.max(0,Math.min(1,f.v))*(key==='lamps'?2:1)));
        f.v-=dt*0.9; if(f.v<=0) delete flashes[key];
      }
      for(const m of KEYMATS[key]){
        m.emissive.copy(m.userData.baseE).multiplyScalar(m.userData.baseI).add(tmpC);
        m.emissiveIntensity=1;
      }
    }
  }

  function resize(){
    const w=stage.clientWidth,h=stage.clientHeight;
    renderer.setSize(w,h);
    const pw=(w>=900 && !panel.classList.contains('collapsed'))?panel.offsetWidth+16:0;
    if(pw){ camera.aspect=(w+pw)/h; camera.setViewOffset(w+pw,h,0,0,w,h); }
    else { camera.aspect=w/h; camera.clearViewOffset(); }
    camera.updateProjectionMatrix();
    if(popKey) placePop();
  }
  window.addEventListener('resize',resize);
  resize();
  goTo('overview',true);

  const clk=new THREE.Clock(); let ebFrame=0;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  renderer.setAnimationLoop(()=>{
    const dt=Math.min(clk.getDelta(),0.05);
    if(fly){
      fly.s=Math.min(1,fly.s+dt/(fly.dur||1.1)); const k=ease(fly.s);
      camera.position.lerpVectors(fly.p0,fly.p1,k); controls.target.lerpVectors(fly.t0,fly.t1,k);
      if(fly.s>=1) fly=null;
    }
    if(blindLevel!==blindTarget){
      const step=dt*0.6, d=blindTarget-blindLevel;
      blindLevel=Math.abs(d)<=step?blindTarget:blindLevel+Math.sign(d)*step;
      setBlinds(blindLevel);
    }
    const wdx=wbTarget-wbCenter.position.x;
    if(Math.abs(wdx)>0.0005) wbCenter.position.x+=wdx*Math.min(1,dt*3.5); else wbCenter.position.x=wbTarget;
    if(ebOn && (++ebFrame%10===0)) renderEb();
    controls.update();
    ceilingGroup.visible=camera.position.y<H-0.05;
    updateHighlights(clk.elapsedTime,dt);
    updateHover();
    renderer.render(scene,camera);
  });
})();
</script>

</body>
</html>
